spring.application.name=BrowBrowneria
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/browbrowneria}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT — em produção use JWT_SECRET (mínimo 32 caracteres)
jwt.secret=${JWT_SECRET:brow-browneria-chave-jwt-troque-em-producao-32b}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.config.import=optional:classpath:application-local.properties
